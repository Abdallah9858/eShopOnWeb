# .ado/eshoponweb-cd-webapp-code.yml

resources:
  pipelines:
    - pipeline: eshoponweb-ci
      source: Abdallah9858.eShopOnWeb
      trigger: true

variables:
  azureServiceConnection: 'azureconnection'
  resourceGroup: 'az400'
  location: 'West Europe'
  subscriptionId: '2312afc3-aa93-4bd9-96f6-c7a769252f5e'
  webAppName: 'az400-webapp-abdallah-2026'

stages:
- stage: Deploy
  displayName: Deploy eShopOnWeb

  jobs:
  - job: Deploy
    pool:
      name: Default

    steps:

    # Download CI artifacts
    - download: eshoponweb-ci
      displayName: Download CI artifacts

    # Deploy App Service Plan + App Service using Bicep
    - task: AzureCLI@2
      displayName: Deploy App Service using Bicep
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az account set --subscription "$(subscriptionId)"

          az deployment group create \
            --resource-group "$(resourceGroup)" \
            --template-file "$(Pipeline.Workspace)/eshoponweb-ci/Bicep/webapp.bicep" \
            --parameters webAppName="$(webAppName)" location="$(location)" \
            --mode Incremental

    # Deploy website
    - task: AzureRmWebAppDeployment@4
      displayName: Deploy eShopOnWeb
      inputs:
        ConnectionType: 'AzureRM'
        azureSubscription: '$(azureServiceConnection)'
        appType: 'webApp'
        WebAppName: '$(webAppName)'
        packageForLinux: '$(Pipeline.Workspace)/eshoponweb-ci/Website/Web.zip'